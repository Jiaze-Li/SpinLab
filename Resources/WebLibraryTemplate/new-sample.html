<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <title>New Sample - SpinLab</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="new-sample-body">
    <main class="new-sample">
      <header class="new-sample-head">
        <h1>New Sample</h1>
        <a class="new-sample-back" href="./">Library</a>
      </header>

      <form id="sample-form" class="new-sample-form" autocomplete="off" novalidate>
        <div id="form-fields"></div>
        <div id="submit-status" class="submit-status" role="status" aria-live="polite"></div>
        <div class="submit-row">
          <button type="submit" id="submit-button" class="submit-button">Submit</button>
          <button type="button" id="another-button" class="another-button" hidden>New another</button>
        </div>
      </form>
    </main>
    <script src="./new-sample.js" defer></script>
  </body>
</html>
