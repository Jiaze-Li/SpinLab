name: Release Tag

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tag main with the app version if not yet tagged
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*static let library = "\(v[0-9]*\.[0-9]*\.[0-9]*\)".*/\1/p' Sources/SpinLabApp/App/AppVersion.swift | head -n 1)"
          [[ -n "$VERSION" ]] || { echo "version not found"; exit 1; }
          if git rev-parse -q --verify "refs/tags/${VERSION}" >/dev/null; then
            echo "${VERSION} already tagged; nothing to do"
          else
            git tag "${VERSION}" "${GITHUB_SHA}"
            git push origin "${VERSION}"
          fi
