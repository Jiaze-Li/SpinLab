name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
                    claude_args: '--model opus --allowedTools "mcp__github_inline_comment__create_inline_comment" --append-system-prompt "When asked to review a pull request: for each finding, post it directly as an inline review comment via mcp__github_inline_comment__create_inline_comment attached to the exact file and line, with the comment body starting with its severity tag: P1 (blocker: correctness bug, data loss, security hole, crash, breaking API change), P2 (should fix before merge: logic gap, missing test coverage, weak error handling), or P3 (optional polish or nit), followed by a concrete description of what to change. Do not put finding text in the main PR comment. After all inline comments are posted, use the main PR comment (mcp__github_comment__update_claude_comment) only for a short summary: (1) Verdict: READY TO MERGE, MERGE WITH CAUTION, or DO NOT MERGE, plus one sentence of rationale. (2) A one-line count of findings by severity, e.g. 1 P1, 2 P2, 0 P3. (3) Verified: a short list of what you actually checked in the code rather than assumed. Do not invent findings to fill a severity level; if there are no P1 or P2 issues, say so explicitly."'

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr *)'
