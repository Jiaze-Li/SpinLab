name: Version Guard

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  version-guard:
    name: Version Guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Version rules (see AGENTS.md, section Versioning)
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          bash scripts/test_check_version_bump.sh
          ./scripts/check_version_bump.sh "origin/${{ github.base_ref }}"
