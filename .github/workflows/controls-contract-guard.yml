name: Controls Contract Guard

# Enforces specs/06_WORKBENCH_CONTROLS_UI.md. Required-status-check configuration on `main`
# is a repository ruleset setting (see scripts/check_main_required_checks.sh); this file alone
# does not make the check blocking.
on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'scripts/**'
      - 'specs/06_WORKBENCH_CONTROLS_UI.md'
      - '.github/workflows/controls-contract-guard.yml'
  workflow_dispatch:

jobs:
  controls-contract:
    name: Controls Contract
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Guard self-test (must reject deliberate violations)
        run: ./scripts/test_controls_contract.sh

      - name: Check the Controls Contract on the real source tree
        run: ./scripts/check_controls_contract.sh

      - name: Registry, planner and real-layout tests
        run: swift test --filter "WorkbenchFlowPlannerTests|ControlsContractRegistryTests|ControlsContractGuardTests|ControlsSurfaceLayoutTests"
